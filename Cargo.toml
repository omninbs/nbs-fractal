[package]
name = "nbs-fractal"
version = "0.1.0"
authors = ["kemiamu <kemya@tuta.io>"]
edition = "2024"
repository = "https://github.com/omninbs/nbs-fractal"
description = "Experimental repetition-pattern reconstruction of OpenNBS .nbs songs"
license = "AGPL-3.0-or-later"
readme = "README.md"
keywords = ["nbs", "music", "minecraft", "redstone"]
categories = ["games"]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
counter = "0.7.1"
itertools = "0.15.0"
mcdata = "0.4.0"
rustmatica = "0.5.2"

rsnbs = "0.1.4"

[dev-dependencies]
ordered-float = "5.3.0"

[[bin]]
name = "nbs-fractal"
path = "src/bin/cli.rs"
