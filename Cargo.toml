[package]
name = "nbs-fractal"
version = "0.1.3"
authors = ["kemiamu <kemya@tuta.io>"]
edition = "2024"
repository = "https://github.com/omninbs/nbs-fractal"
description = "Experimental repetition-pattern reconstruction of OpenNBS .nbs songs"
license = "AGPL-3.0-or-later"
readme = "README.md"
keywords = ["nbs", "music", "minecraft", "redstone"]
categories = ["games"]

[dependencies]
rsnbs = ">=0.1.7, <0.2.0"
clap = { version = ">=4.6.1, <5.0.0", features = ["derive"] }
counter = ">=0.7.1, <0.8.0"
itertools = ">=0.15.0, <0.16.0"
litematica = ">=0.2.0, <0.3.0"

[dev-dependencies]
# meow

[[bin]]
name = "nbs-fractal"
path = "src/bin/cli.rs"
